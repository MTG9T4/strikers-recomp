; Local Wireless shows rooms from PCs on the same network and from the internet (mode = internet):
; nothing to set up. Friends who want only each other's internet rooms set the same room_key (or type it in F1 > Online).
; mode = lan keeps to the same network. A private group over ZeroTier needs mode = zerotier and your organizer's settings.
window = borderless_fullscreen
width = 1280
height = 720
resolution_scale = window
upscale = fsr
sharpness = 0.2

[Network]
mode = internet
room_key =
relay =
zerotier_network =
group_service =
group_code =
