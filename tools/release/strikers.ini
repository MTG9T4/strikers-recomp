; Local Wireless plays with PCs on the same network (mode = lan): nothing to set up.
; To play over the internet with a group, your organizer sends a strikers.ini with mode = zerotier,
; the service address and a private invite code.
window = borderless_fullscreen
width = 1280
height = 720
resolution_scale = window
upscale = fsr
sharpness = 0.2

[Network]
mode = lan
zerotier_network =
group_service =
group_code =
